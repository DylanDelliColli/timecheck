name: timecheck checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - run: scripts/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-report
          path: |
            report.json
            build/check-fixtures-report.json
  changed-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - uses: actions/cache@v4
        with:
          path: .cache/snapshots
          key: archive-sha256-${{ hashFiles('data/**/*.json') }}
          restore-keys: archive-sha256-
      - name: Verify changed evidence items and items using changed sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .venv/bin/python scripts/verify_evidence.py --base "$BASE_SHA" --head "$HEAD_SHA" --cache-dir .cache/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changed-evidence-report
          path: report.json
  scheduled-evidence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Full live archive verification
        run: .venv/bin/timecheck build --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-report
          path: report.json
